<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .n{fill:#0b1f17;stroke:#22ff9a;stroke-width:1.5}
    .x{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:600;fill:#eafff5;text-anchor:middle}
    .s{font-family:Consolas,monospace;font-size:10px;fill:#7fe8b8;text-anchor:middle}
    .f{stroke:#22ff9a;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .p{animation:glow 2.8s ease-in-out infinite}
    @keyframes glow{0%,100%{fill:#0b1f17}50%{fill:#134e35}}
    .d1{animation-delay:0s}.d2{animation-delay:.4s}.d3{animation-delay:.8s}.d4{animation-delay:1.2s}.d5{animation-delay:1.6s}.d6{animation-delay:2s}
  </style>
  <rect width="900" height="200" rx="14" fill="#04130d"/>
  <g>
    <rect class="n p d1" x="20"  y="70" width="110" height="60" rx="10"/><text class="x" x="75"  y="97">Camera</text><text class="s" x="75"  y="115">DirectShow</text>
    <rect class="n p d2" x="165" y="70" width="110" height="60" rx="10"/><text class="x" x="220" y="97">OpenCV</text><text class="s" x="220" y="115">capture</text>
    <rect class="n p d3" x="310" y="70" width="110" height="60" rx="10"/><text class="x" x="365" y="97">YOLO</text><text class="s" x="365" y="115">&lt;15 ms</text>
    <rect class="n p d4" x="455" y="70" width="110" height="60" rx="10"/><text class="x" x="510" y="97">Tracker</text><text class="s" x="510" y="115">EMA + vote</text>
    <rect class="n p d5" x="600" y="25" width="120" height="55" rx="10"/><text class="x" x="660" y="50">FastAPI</text><text class="s" x="660" y="67">MJPEG · WS · REST</text>
    <rect class="n p d5" x="600" y="125" width="120" height="55" rx="10"/><text class="x" x="660" y="150">SQLite</text><text class="s" x="660" y="167">debounced log</text>
    <rect class="n p d6" x="760" y="70" width="120" height="60" rx="10"/><text class="x" x="820" y="97">React 19</text><text class="s" x="820" y="115">HUD · KPIs</text>
  </g>
  <path class="f" d="M130 100H165"/><path class="f" d="M275 100H310"/><path class="f" d="M420 100H455"/>
  <path class="f" d="M565 100 C585 100 585 52 600 52"/><path class="f" d="M565 100 C585 100 585 152 600 152"/>
