<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04130d"/><stop offset="1" stop-color="#0a2a1d"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22ff9a" stop-opacity="0"/>
      <stop offset="1" stop-color="#22ff9a" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#134e35" stroke-width="0.6"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Arial,sans-serif}
    .title{font-size:46px;font-weight:800;fill:#eafff5;letter-spacing:1px}
    .sub{font-size:16px;fill:#7fe8b8;letter-spacing:3px}
    .lbl{font-family:Consolas,monospace;font-size:13px;font-weight:700;fill:#04130d}
    .scanline{animation:sweep 3.2s linear infinite}
    @keyframes sweep{0%{transform:translateY(-60px)}100%{transform:translateY(300px)}}
    .box{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
    .tag{opacity:0;animation:cycle 12s infinite}
    .t1{animation-delay:0s}.t2{animation-delay:2s}.t3{animation-delay:4s}
    .t4{animation-delay:6s}.t5{animation-delay:8s}.t6{animation-delay:10s}
    @keyframes cycle{0%{opacity:0}3%{opacity:1}15%{opacity:1}18%{opacity:0}100%{opacity:0}}
    .dot{animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="900" height="280" rx="18" fill="url(#bg)"/>
  <rect width="900" height="280" rx="18" fill="url(#grid)"/>
  <rect class="scanline" x="0" y="0" width="900" height="60" fill="url(#scan)"/>

  <!-- title -->
  <text class="t title" x="40" y="105">ECOVISION <tspan fill="#22ff9a">ST-04</tspan></text>
  <text class="t sub" x="42" y="140">OPTICAL WASTE SEGREGATION &amp; TELEMETRY</text>
  <text class="t" x="42" y="185" font-size="15" fill="#a6f3cf">&lt;15 ms inference  ·  60 FPS HUD  ·  100% offline</text>
  <circle class="dot" cx="48" cy="225" r="6" fill="#ff4d4d"/>
  <text class="t" x="64" y="230" font-size="14" fill="#ffb3b3" font-family="Consolas,monospace">LIVE · camera online</text>

  <!-- detection frame -->
  <g transform="translate(600,50)">
    <rect x="0" y="0" width="260" height="190" rx="10" fill="#0b1f17" stroke="#1d6b49"/>
    <g class="box" fill="none" stroke="#22ff9a" stroke-width="2.5">
      <path d="M30 60 v-22 h22 M230 60 v-22 h-22 M30 150 v22 h22 M230 150 v22 h-22"/>
      <rect x="62" y="62" width="136" height="86" stroke-dasharray="6 4" stroke-width="1.5"/>
    </g>
    <!-- object -->
    <rect x="95" y="80" width="70" height="50" rx="8" fill="#134e35" stroke="#22ff9a" stroke-opacity=".5"/>
    <!-- cycling tags -->
    <g transform="translate(62,40)">
      <g class="tag t1"><rect width="150" height="22" rx="4" fill="#facc15"/><text class="lbl" x="8" y="15">[CARD] 0.94 → YELLOW</text></g>
      <g class="tag t2"><rect width="150" height="22" rx="4" fill="#facc15"/><text class="lbl" x="8" y="15">[PLAS] 0.91 → YELLOW</text></g>
      <g class="tag t3"><rect width="150" height="22" rx="4" fill="#facc15"/><text class="lbl" x="8" y="15">[METL] 0.89 → YELLOW</text></g>
      <g class="tag t4"><rect width="150" height="22" rx="4" fill="#facc15"/><text class="lbl" x="8" y="15">[PAPR] 0.93 → YELLOW</text></g>
      <g class="tag t5"><rect width="150" height="22" rx="4" fill="#4ade80"/><text class="lbl" x="8" y="15">[GLAS] 0.90 → GREEN</text></g>
      <g class="tag t6"><rect width="150" height="22" rx="4" fill="#d6a46b"/><text class="lbl" x="8" y="15">[ORGA] 0.72 → BROWN</text></g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
